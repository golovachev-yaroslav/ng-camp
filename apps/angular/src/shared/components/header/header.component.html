<mat-toolbar class="root">
	<a mat-button routerLink="/">Anime Application</a>
	<div class="buttons">
		@if (isAuthorizedUser()) {
			<button mat-button color="primary" class="button" type="button" (click)="onLogout()">
				<mat-icon>logout</mat-icon> Logout
			</button>
		} @else {
			<a mat-button color="primary" class="button" routerLink="/auth/register">Sign Up</a>
			<a mat-button color="primary" class="button" routerLink="/auth/login">Sign In</a>
		}
	</div>
</mat-toolbar>
